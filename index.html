<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />

        <!-- Fonts -->
        <link rel="stylesheet" href="./assets/fonts/stylesheet.css" />

        <!-- Reset CSS -->
        <link rel="stylesheet" href="./assets/css/reset.css" />

        <!-- Styles CSS -->
        <link rel="stylesheet" href="./assets/css/styles.css" />

        <title>Frontend Mentor | Social links profile</title>
    </head>
    <body>
        <main>
            <div class="container">
                <article class="bio">
                    <div class="bio__container">
                        <div class="bio__top">
                            <img class="bio__avt" src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall" />
                            <div class="bio__info">
                                <h1 class="bio__heading">Jessica Randall</h1>
                                <p class="bio__address">London, United Kingdom</p>
                                <p class="bio__desc">"Front-end developer and avid reader."</p>
                            </div>
                        </div>
                        <div>
                            <ul class="bio__list">
                                <li class="bio__item">
                                    <a class="bio__link" href="#">GitHub</a>
                                </li>
                                <li class="bio__item">
                                    <a class="bio__link" href="#">Frontend Mentor</a>
                                </li>
                                <li class="bio__item">
                                    <a class="bio__link" href="#">LinkedIn</a>
                                </li>
                                <li class="bio__item">
                                    <a class="bio__link" href="#">Twitter</a>
                                </li>
                                <li class="bio__item">
                                    <a class="bio__link" href="#">Instagram</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </article>
            </div>
        </main>

        <footer class="attribution">Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. Coded by <a href="#">Tuan Khoi</a>.</footer>
    </body>
</html>
